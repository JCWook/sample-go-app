apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  schedule:
    - cron: 0,5,10,15,20,25,30,35,40,45,50,55 * * * *
  workflow_dispatch:
    inputs:
      batch_size:
        type: number
        default: 25
      batch_number:
        type: number
        default: 0
      from_batch_number:
        type: number
        default: 0
        required: true
      to_batch_number:
        type: number
        default: 0
        required: true  
      delete:
        type: boolean
        default: false     


jobs:
  find-old-artifacts:
    steps:
      - name: list-artifacts
        uses: docker://urvashisingh/jq:0.0.4
        shell: sh
        run: |
          batch_size=25
          delete=true
          
          for i in {1..3};
          do

            URL="${{ cloudbees.api.url }}/reserved/v1/delete-old-artifacts?batchSize=${batch_size}&batchNumber=0&delete=${delete}"
            echo "Delete? ${delete}, Iteration: $i"
            echo "`date` - Calling: $URL"
            response=$(curl --silent --show-error --fail-with-body -X DELETE -H "Authorization: Bearer ${{ cloudbees.api.token }}" "$URL") || command_failed=1
            if [ ${command_failed:-0} -eq 1 ];
            then
              echo "Error: '$response'"
            else
              echo $response > /tmp/result${i}.json
              jq -r '.results[] | .tableName as $tblName | .artifacts[] |= {
                artifact: .artifact + {
                  tableName: $tblName,
                  tenantName: .tenantName
                }
              } | .artifacts[].artifact | [ .tenantName, .tableName, .resourceId, .resourceName, .applicationId, .applicationName, .id, .name, .url, .version, .digest, .operation, .publishedBy, .publishedOn, .deployedBy, .deployedOn, .environment ] | @csv ' /tmp/result${i}.json
            fi
          done

