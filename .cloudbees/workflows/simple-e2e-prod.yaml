apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
jobs:
  build:
    steps:
      - uses: cloudbees-io/register-build-artifact@v1
        with:
          name: art1
          version: ${{ cloudbees.version }}
          url: art1::${{ cloudbees.version }}
  dev-deploy:
    steps:
      - uses: cloudbees-io/register-deployed-artifact@v1
        with:
          name: art1
          version: ${{ cloudbees.version }}
          url: art1::${{ cloudbees.version }}
          target-environment: dev
    needs:
      - build
  test-deploy:
    steps:
      - uses: cloudbees-io/register-deployed-artifact@v1
        with:
          name: art1
          version: ${{ cloudbees.version }}
          url: art1::${{ cloudbees.version }}
          target-environment: test
    needs:
      - build
  prod-deploy:
    steps:
      - uses: cloudbees-io/register-deployed-artifact@v1
        with:
          name: art1
          version: ${{ cloudbees.version }}
          url: art1::${{ cloudbees.version }}
          target-environment: us-prod
    needs:
      - approve
  publish-evidence:
    steps:
      - name: publish evidence
        with:
          content: "This is from published evidence: Approved with str param: ${{fromJSON(needs.approve.outputs.approvalInputValues).str}} and comments: ${{needs.approve.outputs.comments}}"
        uses: cloudbees-io/publish-evidence-item@v1
    needs:
      - deploy
      - approve
  approve:
    needs:
      - dev-deploy
      - test-deploy
    with:
      approvers: 3bbc24ac-e80d-11ea-a794-42010a83ae1a
      disallowLaunchByUser: false
      instructions: ""
      approvalInputs: |
        str:
          type: string
          default: def val
          required: true
        int:
          type: number
        bool:
          type: boolean
          default: true
        options:
          type: choice
          options:
            - op1
            - op2
          default: op1
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
