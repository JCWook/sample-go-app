apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  #schedule:
  #  - cron: 4,10,15,20,25,30,35,40,45,51,56 * * * *
jobs:
  ask-now:
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      approvers: 3bbc24ac-e80d-11ea-a794-42010a83ae1a,3b95fb7e-e80d-11ea-a794-42010a83ae1a
      disallowLaunchByUser: false
      instructions: manual approval test using handler image from public prod ECR registry
  hello:
    steps:
      - uses: docker://alpine/git:latest
        run: |
          echo "test"
    needs: ask-now
