apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      manifest:
        type: string
jobs:
  build:
    steps:
      - uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Input manifest:"
          echo ${{ toJSON(inputs.manifest) }} > /tmp/manifest.json
          cat /tmp/manifest.json
      - uses: https://github.com/urvashisingh/try-api-action
        name: Step One
        with:
          uri: /v1/organizations
          http-method: GET
      - uses: https://github.com/urvashisingh/try-api-action
        name: Step Two
        with:
          uri: /v1/organizations
          http-method: GET        
