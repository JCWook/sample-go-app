apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
      version:
        type: string
      url:
        type: string
      digest:
        type: string
      app_id:
        type: string 
        default: 649308a1-7837-430f-955b-0d1dcc27c319     
jobs:
  build:
    env:
      ENVIRONMENT: dev
    steps:
      - uses: docker://ghcr.io/helmfile/helmfile:v1.1.2
        env:
          JWT: ${{ cloudbees.api.token }}
          CBP_API_PAT: ${{ secrets.CBP_API_PAT }}
          CB_API_URL: ${{ cloudbees.api.url }}
          CB_RUN_ID: ${{ cloudbees.run_id }}
          CB_RUN_ATTEMPT: ${{ cloudbees.run_attempt }}
        run: |
          set -eo pipefail

          function get-artifact-id() {
            local name=$1
            local version=$2
            local url=$3
            local digest=$4
            local app_id=$5
            local out_artifact_id=$6

            echo "Find artifact with name: $name, version: $version, url: $url, digest: $digest in org $org_id ..."
            query_params="filter.names=${name}&filter.latestOnly=false&filter.searchText=${version}"
            
            echo "query params: $query_params, url: $CB_API_URL"
            response=$(curl --silent --show-error --fail-with-body  -X 'GET' "$CB_API_URL/v3/applications/${app_id}/artifactinfos?${query_params}" \
              -H "Authorization: Bearer $CBP_API_PAT" \
              -H 'Content-Type: application/json') || command_failed=1

            if [ ${command_failed:-0} -eq 1 ];
            then
              echo "Failed to lookup artifact: $name, error: '$response'"
              eval $out_artifact_id=""
            else
              echo $response | jq '.artifacts[]'
              
              if [ "$digest" = "null" ]; then
                echo "wo digest"
                artifact_id="$(echo "$response" | jq --raw-output --arg version "$version" --arg url "$url" '[.artifacts[] | select(.version==$version and .url==$url)] | .[0].id')"  
              else
                echo "with digest"
                artifact_id="$(echo "$response" | jq --raw-output --arg version "$version" --arg url "$url" --arg digest "$digest" '[.artifacts[] | select(.version==$version and .url==$url and .digest==$digest)] | .[0].id')"
              fi
              if [ "$artifact_id" = "null" ] || [ -z "$artifact_id" ]; then
                eval $out_artifact_id="" 
              else
                eval $out_artifact_id="'$artifact_id'"
              fi
            fi  
          }

          function register-deployment-with-id() {
            artifact_id=$1
            
            echo "Registering deployment for artifact id: $artifact_id ..."
            PAYLOAD=$(jq --null-input \
            --arg artifact_id "$artifact_id" \
            --arg runId "$CB_RUN_ID" \
            --arg runAttempt "$CB_RUN_ATTEMPT" \
            --arg environment "$ENVIRONMENT" \
            '{"runId": $runId, "runAttempt": $runAttempt, "artifact_id": $artifact_id, "environment": $environment}')

            echo "payload: $PAYLOAD, url: $CB_API_URL, JWT:$JWT"
            response=$(curl --silent --show-error --fail-with-body  -X 'POST' "$CB_API_URL/v3/deployments" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD") || command_failed=1

            if [ ${command_failed:-0} -eq 1 ];
            then
              echo "Failed to add deployment for artifact_id: $artifact_id, error: '$response'"
            else
              echo $response | jq  
            fi  
          }

          get-artifact-id "${{ inputs.name }}" "${{ inputs.version }}" "${{ inputs.url }}" "${{ inputs.digest }}" "${{ inputs.app_id }}" artifact_id
          echo "Found artifactId: $artifact_id"
          if [ -n "$artifact_id" ]; then
            register-deployment "$artifact_id"
          else
            echo "Variable is empty or not set"
          fi
