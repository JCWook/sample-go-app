apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy
on:
  workflow_call:
    inputs:
      param1:
        type: string
        required: true
      dev_environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      param1:
        type: string
        required: true
      dev_environment:
        type: string
        required: true

jobs:
