    steps:
      - name: Deploy artifact
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Deploying to ${{ inputs.dev_environment }}" 
          echo "Secret 1 ${{ secrets.secret1 }}"

