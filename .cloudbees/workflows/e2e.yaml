apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My automation
on:
  workflow_dispatch:
jobs:
  build:
    environment: us-test-appr
    steps:
      - uses: docker://alpine/git:latest
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - uses: cloudbees-io/checkout@v1
        name: checkout
      - uses: docker://golang:1.20
        name: Build Go app
        kind: build
        run: |
          go build -v ./...
      - uses: cloudbees-io/configure-oci-credentials@v1
        name: Set up Docker Hub registry
        kind: deploy
        with:
          registry: index.docker.io
          username: ${{ secrets.QUICKSTART_DOCKER_USERNAME }}
          password: ${{ secrets.QUICKSTART_DOCKER_PASSWORD }}
      - uses: cloudbees-io/kaniko@v1
        name: Push image to OCI registry
        with:
          destination: index.docker.io/${{ secrets.QUICKSTART_DOCKER_USERNAME }}/my-sample-go-app:${{cloudbees.version}}
  approve-me:
    needs:
      - build
    with:
      approvers: 3bbc24ac-e80d-11ea-a794-42010a83ae1a
      disallowLaunchByUser: false
      instructions: Manually approve this run
      approvalInputs: |
        str1:
          type: string
          default: def
          required: true
        num:
          type: number
          default: ""
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
  